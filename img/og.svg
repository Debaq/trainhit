<!-- Fuente de la tarjeta de enlace (og:image). Se edita acá y se regenera el
     PNG con:  rsvg-convert -w 1200 -h 630 img/og.svg -o img/og.png
     El PNG es lo que consumen WhatsApp, Slack y X: ninguno renderiza SVG. -->
