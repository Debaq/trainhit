  <rect width="1200" height="630" fill="#09090b"/>
  <rect x="0" y="0" width="1200" height="6" fill="#2E7DD6"/>
  <clipPath id="recuadro"><rect x="-16" y="-16" width="432" height="282" rx="14"/></clipPath>

  <g transform="translate(96 150)">
    <path d="M0 96 L44 0 L88 96 L132 0 L176 64" fill="none" stroke="#2E7DD6"
          stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="96" y="330" font-family="DejaVu Sans, sans-serif" font-size="92" fill="#FAFAFA">
    train<tspan font-weight="bold">HIT</tspan>
  </text>
  <text x="96" y="396" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#A1A1AA">
    vHIT didáctico en el navegador
  </text>
  <text x="96" y="448" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#A1A1AA">
    La ganancia del reflejo vestíbulo-ocular
  </text>
  <text x="96" y="488" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#A1A1AA">
    con la webcam, paso a paso.
  </text>
  <g transform="translate(96 522)">
    <rect x="0" y="0" width="466" height="46" rx="10" fill="#D62D2D" fill-opacity="0.14"/>
    <text x="20" y="31" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#D62D2D">
      NO ES UN EQUIPO MÉDICO
    </text>
  </g>
  <text x="96" y="596" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#71717A">
    <tspan font-weight="bold" fill="#A1A1AA">TecMedHub</tspan> · Universidad Austral de Chile
  </text>

