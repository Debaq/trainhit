<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Dos cuadros. A la izquierda, una cara de frente con el teléfono apaisado sobre la frente, encima de las cejas, sujeto con una cinta elástica ancha que pasa por encima. A la derecha, la misma cabeza de perfil: el teléfono pegado a la frente con la pantalla hacia adelante (flecha gris) y la cinta dando la vuelta a la cabeza; los ojos miran el punto rojo de adelante.">
