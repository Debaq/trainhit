<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="178.0mm" height="104.0mm" viewBox="0 0 178.0 104.0" font-family="Arial, Helvetica, sans-serif">
  <title>trainHIT processing pipeline (Figure 2)</title>
  <rect width="178.0" height="104.0" fill="#ffffff"/>
  <rect x="0.40" y="22.00" width="23.00" height="18.00" rx="1.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.3"/>
