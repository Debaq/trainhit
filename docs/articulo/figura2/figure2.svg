  <text x="163.30" y="38.08" font-size="2.822" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Saccades</text>
  <text x="163.30" y="41.52" font-size="2.470" text-anchor="middle" fill="#1a1a1a">covert and overt</text>
  <rect x="149.00" y="49.00" width="28.60" height="19.00" rx="1.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.3"/>
