  <text x="163.30" y="20.01" font-size="2.470" text-anchor="middle" fill="#1a1a1a">area (positions,</text>
  <text x="163.30" y="23.02" font-size="2.470" text-anchor="middle" fill="#1a1a1a">reported), 60 ms</text>
  <text x="163.30" y="26.03" font-size="2.470" text-anchor="middle" fill="#1a1a1a">and peak (velocities)</text>
