  <text x="43.50" y="39.54" font-size="2.470" text-anchor="middle" fill="#1a1a1a">Eyelid state</text>
  <text x="43.50" y="42.55" font-size="2.470" text-anchor="middle" fill="#1a1a1a">(blinks)</text>
