  <rect x="68.00" y="12.00" width="34.00" height="11.00" rx="1.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.3"/>
  <text x="85.00" y="16.54" font-size="2.470" text-anchor="middle" fill="#1a1a1a" font-weight="bold">MediaPipe iris landmarks</text>
  <text x="85.00" y="19.55" font-size="2.470" text-anchor="middle" fill="#1a1a1a">(default)</text>
